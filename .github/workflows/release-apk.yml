name: Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      flavor:
        description: 'Build flavor'
        required: true
        type: choice
        default: 'prod'
        options:
          - dev
          - staging
          - prod
      build_type:
        description: 'Build type'
        required: true
        type: choice
        default: 'release'
        options:
          - debug
          - release

permissions:
  contents: write
  actions: read

jobs:
  build-apk:
    name: Build & Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-apk-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-apk-${{ runner.os }}-

      - name: Verify google-services.json exists
        run: |
          if [ ! -f composeApp/google-services.json ]; then
            echo "::error::composeApp/google-services.json not found in the repo"
            exit 1
          fi
          echo "google-services.json found"

      - name: Determine build parameters
        id: params
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "flavor=${{ inputs.flavor }}" >> $GITHUB_OUTPUT
            echo "build_type=${{ inputs.build_type }}" >> $GITHUB_OUTPUT
          else
            echo "flavor=prod" >> $GITHUB_OUTPUT
            echo "build_type=release" >> $GITHUB_OUTPUT
          fi

      - name: Assemble APK
        run: |
          FLAVOR=${{ steps.params.outputs.flavor }}
          BUILD_TYPE=${{ steps.params.outputs.build_type }}
          echo "Building ${FLAVOR}${BUILD_TYPE^} APK..."
          ./gradlew :composeApp:assemble${FLAVOR^}${BUILD_TYPE^} --no-daemon --stacktrace

      - name: Generate version tag
        id: tag
        run: |
          # Use date + short SHA for a unique, sortable tag
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          DATE_TAG=$(date -u +'%Y%m%d-%H%M%S')
          TAG="v${DATE_TAG}-${SHORT_SHA}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Generated tag: $TAG"

      - name: Find APK files
        id: apk
        run: |
          FLAVOR=${{ steps.params.outputs.flavor }}
          BUILD_TYPE=${{ steps.params.outputs.build_type }}
          APK_DIR="composeApp/build/outputs/apk/${FLAVOR}/${BUILD_TYPE}"
          echo "Searching in: $APK_DIR"
          ls -la "$APK_DIR"/*.apk || { echo "::error::No APK found"; exit 1; }
          APK_PATH=$(ls "$APK_DIR"/*.apk | head -1)
          APK_NAME=$(basename "$APK_PATH")
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "apk_name=$APK_NAME" >> $GITHUB_OUTPUT
          echo "Found APK: $APK_NAME"

      - name: Rename APK with tag
        run: |
          TAG=${{ steps.tag.outputs.tag }}
          FLAVOR=${{ steps.params.outputs.flavor }}
          BUILD_TYPE=${{ steps.params.outputs.build_type }}
          SRC="${{ steps.apk.outputs.apk_path }}"
          DEST="composeApp/build/outputs/apk/enrollplus-${FLAVOR}-${BUILD_TYPE}-${TAG}.apk"
          cp "$SRC" "$DEST"
          echo "Renamed APK: $DEST"
          ls -lh "$DEST"

      - name: Upload APK to artifacts
        uses: actions/upload-artifact@v5
        with:
          name: enrollplus-apk-${{ steps.tag.outputs.tag }}
          path: composeApp/build/outputs/apk/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Create Git tag
        run: |
          TAG=${{ steps.tag.outputs.tag }}
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Auto-release APK build $TAG

          Flavor: ${{ steps.params.outputs.flavor }}
          Build type: ${{ steps.params.outputs.build_type }}
          Commit: ${{ github.sha }}
          Triggered by: ${{ github.actor }}"
          git push origin "$TAG"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "APK Release ${{ steps.tag.outputs.tag }}"
          body: |
            ## APK Build Details

            - **Flavor:** ${{ steps.params.outputs.flavor }}
            - **Build type:** ${{ steps.params.outputs.build_type }}
            - **Commit:** ${{ github.sha }}
            - **Triggered by:** ${{ github.actor }}

            ### Download
            Download the APK from the **Assets** section below, or from the
            [Actions artifacts](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}).
          files: |
            composeApp/build/outputs/apk/*.apk
          prerelease: false
          make_latest: true

      - name: Upload APK to Slack
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
        run: |
          if [ -z "$SLACK_BOT_TOKEN" ] || [ -z "$SLACK_CHANNEL_ID" ]; then
            echo "::warning::SLACK_BOT_TOKEN or SLACK_CHANNEL_ID secret not set — skipping Slack upload"
            exit 0
          fi

          TAG="${{ steps.tag.outputs.tag }}"
          FLAVOR="${{ steps.params.outputs.flavor }}"
          BUILD_TYPE="${{ steps.params.outputs.build_type }}"
          APK_FILE=$(ls composeApp/build/outputs/apk/enrollplus-*.apk | head -1)
          APK_NAME=$(basename "$APK_FILE")
          APK_SIZE=$(stat -c%s "$APK_FILE")

          echo "Uploading $APK_NAME ($APK_SIZE bytes) to Slack..."

          # Step 1: Get upload URL from Slack (new files.getUploadURLExternal API)
          UPLOAD_RESP=$(curl -s --max-time 30 -X POST https://slack.com/api/files.getUploadURLExternal \
            -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
            -F "filename=$APK_NAME" \
            -F "length=$APK_SIZE")

          echo "getUploadURLExternal response: $UPLOAD_RESP"

          if echo "$UPLOAD_RESP" | grep -q '"ok":false'; then
            echo "::error::Failed to get upload URL: $UPLOAD_RESP"
            exit 1
          fi

          # Use python3 to parse JSON (handles escaped slashes correctly)
          UPLOAD_URL=$(echo "$UPLOAD_RESP" | python3 -c "import sys,json; print(json.load(sys.stdin)['upload_url'])")
          FILE_ID=$(echo "$UPLOAD_RESP" | python3 -c "import sys,json; print(json.load(sys.stdin)['file_id'])")

          if [ -z "$UPLOAD_URL" ] || [ -z "$FILE_ID" ]; then
            echo "::error::Could not parse upload URL or file ID from response"
            exit 1
          fi

          echo "Got upload URL and file_id: $FILE_ID"

          # Step 2: Upload the file to the provided URL (raw binary body, not multipart)
          UPLOAD_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 120 \
            -X POST "$UPLOAD_URL" \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@$APK_FILE")

          if [ "$UPLOAD_STATUS" != "200" ]; then
            echo "::error::File upload to Slack URL failed with HTTP $UPLOAD_STATUS"
            exit 1
          fi

          echo "File uploaded to Slack storage"

          # Step 3: Complete the upload and share to channel
          COMPLETE_RESP=$(curl -s --max-time 30 -X POST https://slack.com/api/files.completeUploadExternal \
            -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "{\"files\":[{\"id\":\"$FILE_ID\",\"title\":\"Enroll+ APK — $TAG\"}],\"channel_id\":\"$SLACK_CHANNEL_ID\",\"initial_comment\":\"📱 *New APK Build*\\n• *Tag:* $TAG\\n• *Flavor:* $FLAVOR\\n• *Build:* $BUILD_TYPE\\n• *Commit:* ${{ github.sha }}\\n• *Triggered by:* ${{ github.actor }}\\n\\nDownload: https://github.com/${{ github.repository }}/releases/tag/$TAG\"}")

          echo "completeUploadExternal response: $COMPLETE_RESP"

          if echo "$COMPLETE_RESP" | grep -q '"ok":false'; then
            echo "::error::Slack complete upload failed: $COMPLETE_RESP"
            exit 1
          fi

          echo "APK uploaded to Slack successfully"
