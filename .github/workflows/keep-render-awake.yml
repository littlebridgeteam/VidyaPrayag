name: Keep Render Awake

on:
  schedule:
    # Every 1 minute, 24/7
    - cron: '* * * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Health check ping + Slack alert on failure
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 ${{ secrets.RENDER_HEALTH_URL || 'https://vidyaprayag-1.onrender.com/api/v1/health' }})
          echo "Health check returned: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "::warning::Server returned $STATUS"
            # Send Slack alert if secrets are configured
            if [ -n "$SLACK_BOT_TOKEN" ] && [ -n "$SLACK_CHANNEL_ID" ]; then
              curl -s -X POST https://slack.com/api/chat.postMessage \
                -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
                -H "Content-Type: application/json" \
                -d "{\"channel\":\"$SLACK_CHANNEL_ID\",\"text\":\"🔴 *Render server is DOWN*\n• *Health check:* HTTP $STATUS\n• *Time:* $(date -u +'%Y-%m-%d %H:%M:%S UTC')\n• *URL:* ${{ secrets.RENDER_HEALTH_URL || 'https://vidyaprayag-1.onrender.com/api/v1/health' }}\"}" > /dev/null
              echo "Slack alert sent"
            else
              echo "Slack secrets not configured — skipping alert"
            fi
          fi
