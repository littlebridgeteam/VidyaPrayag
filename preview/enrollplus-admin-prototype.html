<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EnrollPlus Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F5F7; --surface:#FFFFFF; --surface-2:#EDEEF1; --surface-3:#E2E4E9;
  --ink:#1A1B23; --ink-2:#4A4B57; --ink-3:#8A8B99; --ink-4:#B8BAC4;
  --line:#E0E1E8; --line-soft:#EDEEF1;
  --accent:#3B5BDB; --accent-soft:#E8EDFB; --accent-ink:#2A44A8;
  --success:#1B8738; --success-soft:#E4F5E9;
  --danger:#D43A2F; --danger-soft:#FBE9E7;
  --warning:#C77700; --warning-soft:#FFF3E0;
  --r-xs:4px; --r-sm:6px; --r-md:10px; --r-lg:14px;
  --font:'Inter',system-ui,-apple-system,sans-serif;
  --dur:180ms; --ease:cubic-bezier(.2,0,0,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{font-family:var(--font);background:#2A2B33;color:var(--ink);-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input{font-family:inherit;outline:none}
svg{width:18px;height:18px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}

/* Shell */
.shell{display:flex;height:100vh;width:100vw}
.sidebar{width:240px;background:#1A1B23;flex-shrink:0;display:flex;flex-direction:column;padding:16px 0;border-right:1px solid #2A2B33}
.sidebar-brand{padding:0 20px 20px;display:flex;align-items:center;gap:10px}
.sidebar-brand-mark{width:32px;height:32px;border-radius:var(--r-sm);background:var(--accent);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:14px}
.sidebar-brand-name{font-size:14px;font-weight:600;color:#E0E1E8;letter-spacing:-.3px}
.sidebar-brand-sub{font-size:10px;color:#6A6B7A;font-weight:500}
.sidebar-nav{flex:1;display:flex;flex-direction:column;gap:2px;padding:0 8px;overflow-y:auto}
.sidebar-nav::-webkit-scrollbar{width:0}
.sidebar-nav-label{font-size:10px;font-weight:600;color:#5A5B6A;text-transform:uppercase;letter-spacing:.6px;padding:16px 12px 6px}
.sidebar .nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--r-sm);font-size:13px;font-weight:500;color:#9A9BAA;transition:background var(--dur),color var(--dur)}
.sidebar .nav-item svg{width:16px;height:16px;opacity:.7}
.sidebar .nav-item:hover{background:#25262E;color:#C0C1CC}
.sidebar .nav-item.active{background:var(--accent);color:#fff}
.sidebar .nav-item.active svg{opacity:1}
.sidebar-footer{padding:12px 20px;border-top:1px solid #25262E}
.sidebar-user{display:flex;align-items:center;gap:10px}
.sidebar-user-avatar{width:28px;height:28px;border-radius:50%;background:#3A3B47;color:#C0C1CC;font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center}
.sidebar-user-name{font-size:12px;font-weight:600;color:#C0C1CC}
.sidebar-user-role{font-size:10px;color:#6A6B7A}

/* Phone */
.phone-wrap{flex:1;display:flex;align-items:center;justify-content:center;background:#2A2B33;padding:20px}
.phone{width:390px;height:844px;max-height:calc(100vh - 40px);background:var(--bg);border-radius:44px;overflow:hidden;position:relative;box-shadow:0 0 0 11px #1A1B23,0 0 0 12px #353640;flex-shrink:0}
.phone-notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:120px;height:28px;background:#1A1B23;border-radius:0 0 18px 18px;z-index:100}
.phone-screen{width:100%;height:100%;overflow:hidden;position:relative}

/* Header */
.header{position:absolute;top:0;left:0;right:0;height:52px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 16px;z-index:10}
.header-title{font-size:16px;font-weight:600;color:var(--ink);letter-spacing:-.3px}
.header-actions{display:flex;gap:4px}
.header-icon-btn{width:34px;height:34px;border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;color:var(--ink-3);transition:background var(--dur),color var(--dur);position:relative}
.header-icon-btn:hover{background:var(--surface-2);color:var(--ink-2)}
.header-icon-btn:active{opacity:.6}
.header-icon-btn .dot{position:absolute;top:7px;right:7px;width:7px;height:7px;border-radius:50%;background:var(--danger);border:1.5px solid var(--surface)}

/* Screens */
.screen-area{position:absolute;top:52px;left:0;right:0;bottom:62px;overflow:hidden}
.tab-content{display:none;width:100%;height:100%}
.tab-content.active{display:block}
.scroll{height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch}
.scroll::-webkit-scrollbar{width:0}
.content-pb{padding-bottom:24px}

/* Sections */
.ph-section{padding:0 16px;margin-bottom:20px}
.ph-section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.ph-section-title{font-size:13px;font-weight:600;color:var(--ink);letter-spacing:-.2px}
.ph-section-link{font-size:12px;font-weight:500;color:var(--accent);display:flex;align-items:center;gap:3px;cursor:pointer}
.ph-section-link svg{width:13px;height:13px}
.ph-section-link:active{opacity:.6}
.ib-group{font-size:11px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.5px;padding:0 16px;margin:16px 0 8px}

/* Greeting */
.ph-greeting{padding:12px 16px 4px}
.ph-greeting-name{font-size:20px;font-weight:700;color:var(--ink);letter-spacing:-.5px}
.ph-greeting-sub{font-size:12px;color:var(--ink-3);margin-top:2px}

/* Hero (Attendance) */
.ph-hero{margin:12px 16px 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:16px}
.ph-hero-top{display:flex;align-items:center;gap:16px}
.ph-hero-info{flex:1}
.ph-hero-label{font-size:11px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.4px}
.ph-hero-val{font-size:28px;font-weight:700;color:var(--ink);letter-spacing:-.8px;margin:2px 0}
.ph-hero-sub{font-size:12px;color:var(--ink-2)}
.ph-hero-pct{font-size:12px;font-weight:600;color:var(--success);margin-top:1px}
.ph-hero-ring{width:56px;height:56px;flex-shrink:0;position:relative}
.ph-hero-ring svg{width:56px;height:56px;transform:rotate(-90deg)}
.ph-hero-ring-bg{fill:none;stroke:var(--surface-3);stroke-width:5}
.ph-hero-ring-fill{fill:none;stroke:var(--accent);stroke-width:5;stroke-linecap:round;stroke-dasharray:157;stroke-dashoffset:7.85}
.ph-hero-ring-txt{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:13px;font-weight:700;color:var(--ink)}
.ph-hero-classes{margin-top:12px;padding-top:12px;border-top:1px solid var(--line-soft)}
.ph-hero-class-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.ph-hero-class-row:last-child{margin-bottom:0}
.ph-hero-class-name{font-size:11px;font-weight:500;color:var(--ink-2);width:52px;flex-shrink:0}
.ph-hero-class-bar{flex:1;height:4px;background:var(--surface-3);border-radius:2px;overflow:hidden}
.ph-hero-class-fill{height:100%;background:var(--accent);border-radius:2px}
.ph-hero-class-pct{font-size:11px;font-weight:600;color:var(--ink-2);width:32px;text-align:right;flex-shrink:0}

/* Quick Actions */
.qa-row{display:flex;gap:8px;padding:0 16px;margin-bottom:16px}
.qa-btn{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;transition:background var(--dur),border-color var(--dur)}
.qa-btn:hover{background:var(--surface-2);border-color:var(--ink-4)}
.qa-btn:active{opacity:.7}
.qa-btn-ic{width:32px;height:32px;border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center}
.qa-btn-ic svg{width:16px;height:16px}
.qa-btn-ic--announce{background:var(--accent-soft);color:var(--accent)}
.qa-btn-ic--calendar{background:var(--success-soft);color:var(--success)}
.qa-btn-ic--approve{background:var(--success-soft);color:var(--success)}
.qa-btn-ic--remind{background:var(--warning-soft);color:var(--warning)}
.qa-btn-ic--report{background:var(--surface-3);color:var(--ink-2)}
.qa-btn-label{font-size:11px;font-weight:500;color:var(--ink-2)}

/* Pulse Cards */
.ph-pulse-scroll{display:flex;gap:10px;padding:0 16px;margin-bottom:16px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.ph-pulse-scroll::-webkit-scrollbar{width:0;height:0}
.ph-pulse-card{min-width:130px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:14px;flex-shrink:0;transition:border-color var(--dur)}
.ph-pulse-card:hover{border-color:var(--ink-4)}
.ph-pulse-card:active{opacity:.7}
.ph-pulse-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.ph-pulse-icon{width:28px;height:28px;border-radius:var(--r-xs);display:flex;align-items:center;justify-content:center}
.ph-pulse-icon svg{width:15px;height:15px}
.ph-pulse-icon--fee{background:var(--accent-soft);color:var(--accent)}
.ph-pulse-icon--alert{background:var(--danger-soft);color:var(--danger)}
.ph-pulse-icon--adm{background:var(--success-soft);color:var(--success)}
.ph-pulse-icon--col{background:var(--warning-soft);color:var(--warning)}
.ph-pulse-trend{font-size:10px;font-weight:600;display:flex;align-items:center;gap:2px}
.ph-pulse-trend svg{width:11px;height:11px}
.ph-pulse-trend--up{color:var(--success)}
.ph-pulse-trend--alert{color:var(--danger)}
.ph-pulse-num{font-size:22px;font-weight:700;color:var(--ink);letter-spacing:-.5px}
.ph-pulse-num .unit{font-size:14px;font-weight:600;color:var(--ink-2)}
.ph-pulse-label{font-size:11px;font-weight:600;color:var(--ink-2);margin-top:2px}
.ph-pulse-sub{font-size:10px;color:var(--ink-3);margin-top:2px}

/* Fee Progress */
.ph-fee{margin:0 16px 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:14px}
.ph-fee-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.ph-fee-title{font-size:13px;font-weight:600;color:var(--ink)}
.ph-fee-amt{font-size:13px;font-weight:600;color:var(--ink)}
.ph-fee-amt .sm{font-size:11px;color:var(--ink-3);font-weight:500}
.ph-fee-bar{height:6px;background:var(--surface-3);border-radius:3px;overflow:hidden}
.ph-fee-bar-fill{height:100%;background:var(--accent);border-radius:3px}
.ph-fee-meta{display:flex;justify-content:space-between;margin-top:8px}
.ph-fee-meta-item{font-size:11px;color:var(--ink-3)}
.ph-fee-meta-item .strong{font-weight:600;color:var(--ink-2)}

/* Inbox */
.inbox-item{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--line-soft);transition:background var(--dur)}
.inbox-item:hover{background:var(--surface-2)}
.inbox-item:active{opacity:.7}
.inbox-item:last-child{border-bottom:none}
.inbox-item:first-child{border-top:1px solid var(--line-soft)}
.inbox-dot{width:8px;height:8px;border-radius:50%;background:var(--ink-4);flex-shrink:0}
.inbox-dot--urgent{background:var(--danger)}
.inbox-dot--new{background:var(--accent)}
.inbox-dot--pending{background:var(--warning)}
.inbox-body{flex:1;min-width:0}
.inbox-title{font-size:13px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.inbox-meta{font-size:11px;color:var(--ink-3);margin-top:1px}
.inbox-tag{font-size:10px;font-weight:600;padding:3px 8px;border-radius:var(--r-xs);flex-shrink:0}
.inbox-tag--urgent{background:var(--danger-soft);color:var(--danger)}
.inbox-tag--new{background:var(--accent-soft);color:var(--accent)}
.inbox-tag--pending{background:var(--warning-soft);color:var(--warning)}

/* Activity */
.act-item{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line-soft)}
.act-item:last-child{border-bottom:none;padding-bottom:0}
.act-item:first-child{padding-top:0}
.act-ic{width:30px;height:30px;border-radius:var(--r-xs);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.act-ic svg{width:14px;height:14px}
.act-ic--fee{background:var(--accent-soft);color:var(--accent)}
.act-ic--adm{background:var(--success-soft);color:var(--success)}
.act-ic--ann{background:var(--surface-3);color:var(--ink-2)}
.act-ic--leave{background:var(--warning-soft);color:var(--warning)}
.act-ic--evt{background:var(--surface-3);color:var(--ink-2)}
.act-body{flex:1;min-width:0}
.act-title{font-size:12px;font-weight:600;color:var(--ink)}
.act-meta{font-size:11px;color:var(--ink-3);margin-top:1px}
.act-time{font-size:10px;color:var(--ink-4);margin-top:2px}

/* Bottom Nav */
.bottom-nav{position:absolute;bottom:0;left:0;right:0;height:62px;background:var(--surface);border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-around;padding-bottom:6px;z-index:10}
.bn-item{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink-4);transition:color var(--dur);position:relative}
.bn-item:hover{color:var(--ink-3)}
.bn-item:active{opacity:.6}
.bn-item.active{color:var(--accent)}
.bn-item-ic svg{width:21px;height:21px}
.bn-item-label{font-size:10px;font-weight:600}
.bn-badge{position:absolute;top:-2px;right:8px;min-width:16px;height:16px;border-radius:8px;background:var(--danger);color:#fff;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px}

/* People Tab */
.pp-link-card{display:flex;align-items:center;gap:12px;margin:12px 16px;padding:12px 14px;background:var(--accent-soft);border:1px solid var(--accent-soft);border-radius:var(--r-md);transition:opacity var(--dur)}
.pp-link-card:active{opacity:.7}
.pp-link-ic{width:36px;height:36px;border-radius:var(--r-sm);background:var(--accent);display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0}
.pp-link-ic svg{width:18px;height:18px}
.pp-link-body{flex:1}
.pp-link-title{font-size:13px;font-weight:600;color:var(--accent-ink)}
.pp-link-sub{font-size:11px;color:var(--accent-ink);opacity:.7;margin-top:1px}
.pp-link-badge{min-width:20px;height:20px;border-radius:10px;background:var(--accent);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 6px;flex-shrink:0}

.pp-subtabs,.rec-subtabs{display:flex;gap:4px;padding:0 16px;margin-bottom:12px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.pp-subtabs::-webkit-scrollbar,.rec-subtabs::-webkit-scrollbar{width:0;height:0}
.pp-subtab,.rec-subtab{padding:6px 14px;border-radius:var(--r-sm);font-size:12px;font-weight:600;color:var(--ink-3);background:var(--surface);border:1px solid var(--line);white-space:nowrap;transition:all var(--dur)}
.pp-subtab:hover,.rec-subtab:hover{background:var(--surface-2)}
.pp-subtab:active,.rec-subtab:active{opacity:.7}
.pp-subtab.active,.rec-subtab.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.pp-subtab-content,.rec-subtab-content{display:none}
.pp-subtab-content.active,.rec-subtab-content.active{display:block}

.pp-add-btn{display:flex;align-items:center;justify-content:center;gap:6px;padding:10px 14px;background:var(--surface);border:1px dashed var(--ink-4);border-radius:var(--r-md);font-size:12px;font-weight:600;color:var(--ink-2);transition:all var(--dur)}
.pp-add-btn:hover{border-color:var(--accent);color:var(--accent)}
.pp-add-btn:active{opacity:.7}
.pp-add-btn svg{width:15px;height:15px}

.pp-person-card,.st-card{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line-soft);transition:background var(--dur)}
.pp-person-card:hover,.st-card:hover{background:var(--surface-2)}
.pp-person-card:active,.st-card:active{opacity:.7}
.pp-person-card:first-child,.st-card:first-child{border-top:1px solid var(--line-soft)}
.pp-person-info,.st-info{flex:1;min-width:0}
.pp-person-name,.st-name{font-size:13px;font-weight:600;color:var(--ink)}
.pp-person-meta,.st-meta{font-size:11px;color:var(--ink-3);margin-top:1px}
.pp-person-actions{display:flex;gap:6px;flex-shrink:0}
.pp-person-btn{font-size:11px;font-weight:600;padding:5px 10px;border-radius:var(--r-xs);transition:opacity var(--dur)}
.pp-person-btn:active{opacity:.6}
.pp-person-btn--view{background:var(--surface-2);color:var(--ink-2)}
.pp-person-btn--assign{background:var(--accent-soft);color:var(--accent)}
.pp-person-btn--deactivate{background:var(--warning-soft);color:var(--warning)}

/* Avatars */
.conv-avatar,.st-avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;background:var(--surface-3);color:var(--ink-2)}

/* Student badges */
.st-badge{font-size:10px;font-weight:600;padding:3px 8px;border-radius:var(--r-xs);flex-shrink:0}
.st-badge--present{background:var(--success-soft);color:var(--success)}
.st-badge--absent{background:var(--danger-soft);color:var(--danger)}
.st-badge--late{background:var(--warning-soft);color:var(--warning)}
.st-badge--pending{background:var(--accent-soft);color:var(--accent)}

/* Search */
.st-search{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);margin:0 16px 12px}
.st-search svg{width:16px;height:16px;color:var(--ink-3);flex-shrink:0}
.st-search input{border:none;background:none;font-size:13px;color:var(--ink);width:100%}
.st-search input::placeholder{color:var(--ink-4)}

/* Chips */
.st-chips{display:flex;gap:6px;padding:0 16px;margin-bottom:12px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.st-chips::-webkit-scrollbar{width:0;height:0}
.st-chip{padding:5px 12px;border-radius:var(--r-sm);font-size:11px;font-weight:600;color:var(--ink-3);background:var(--surface);border:1px solid var(--line);white-space:nowrap;transition:all var(--dur)}
.st-chip:active{opacity:.7}
.st-chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}

/* Records */
.rec-summary{margin:12px 16px 12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:16px}
.rec-summary-label{font-size:11px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.4px}
.rec-summary-val{font-size:24px;font-weight:700;color:var(--ink);letter-spacing:-.5px;margin:2px 0}
.rec-summary-sub{font-size:12px;color:var(--ink-2)}
.rec-bar-row{display:flex;align-items:center;gap:10px;padding:6px 0}
.rec-bar-name{font-size:12px;font-weight:500;color:var(--ink-2);min-width:90px;flex-shrink:0}
.rec-bar-track{flex:1;height:5px;background:var(--surface-3);border-radius:3px;overflow:hidden}
.rec-bar-fill{height:100%;border-radius:3px}
.rec-bar-pct{font-size:11px;font-weight:600;color:var(--ink-2);width:34px;text-align:right;flex-shrink:0}
.rec-alert{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line-soft)}
.rec-alert:first-child{border-top:1px solid var(--line-soft)}
.rec-alert-ic{width:28px;height:28px;border-radius:var(--r-xs);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.rec-alert-ic svg{width:14px;height:14px}
.rec-alert-ic--behind{background:var(--danger-soft);color:var(--danger)}
.rec-alert-ic--ahead{background:var(--success-soft);color:var(--success)}
.rec-alert-info{flex:1;min-width:0}
.rec-alert-title{font-size:12px;font-weight:600;color:var(--ink)}
.rec-alert-meta{font-size:11px;color:var(--ink-3);margin-top:1px}
.rec-alert-btn{font-size:11px;font-weight:600;padding:5px 10px;border-radius:var(--r-xs);background:var(--surface-2);color:var(--ink-2);transition:opacity var(--dur)}
.rec-alert-btn:active{opacity:.6}
.rec-empty{padding:40px 16px;text-align:center}
.rec-empty-title{font-size:14px;font-weight:600;color:var(--ink-2)}
.rec-empty-sub{font-size:12px;color:var(--ink-3);margin-top:4px}

/* Fees hero */
.fees-hero{margin:12px 16px 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:16px}
.fees-hero-label{font-size:11px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.4px}
.fees-hero-amount{font-size:28px;font-weight:700;color:var(--ink);letter-spacing:-.8px;margin:2px 0}
.fees-hero-due{font-size:12px;color:var(--ink-2)}
.fees-hero-stats{display:flex;gap:16px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line-soft)}
.fees-hero-stat-num{font-size:18px;font-weight:700;color:var(--ink)}
.fees-hero-stat-label{font-size:10px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.3px}
.fees-hero-btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;margin-top:12px;padding:10px;border-radius:var(--r-sm);background:var(--accent);color:#fff;font-size:12px;font-weight:600;transition:opacity var(--dur)}
.fees-hero-btn:active{opacity:.8}
.fees-hero-btn svg{width:14px;height:14px}
.fees-pay-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line-soft)}
.fees-pay-item:last-child{border-bottom:none;padding-bottom:0}
.fees-pay-item:first-child{padding-top:0}
.fees-pay-icon{width:28px;height:28px;border-radius:var(--r-xs);background:var(--success-soft);color:var(--success);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.fees-pay-icon svg{width:14px;height:14px}
.fees-pay-info{flex:1;min-width:0}
.fees-pay-title{font-size:12px;font-weight:600;color:var(--ink)}
.fees-pay-date{font-size:11px;color:var(--ink-3);margin-top:1px}
.fees-pay-receipt{font-size:10px;color:var(--accent);font-weight:600;margin-top:2px}
.fees-pay-amount{font-size:13px;font-weight:700;color:var(--ink);flex-shrink:0}

/* Comms */
.conv-segments{display:flex;gap:4px;padding:0 16px;margin-bottom:8px}
.conv-seg{flex:1;padding:8px;border-radius:var(--r-sm);font-size:12px;font-weight:600;color:var(--ink-3);background:var(--surface);border:1px solid var(--line);transition:all var(--dur);text-align:center}
.conv-seg:active{opacity:.7}
.conv-seg.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.conv-seg-count{font-size:10px;opacity:.7}
.conv-seg-content{display:none}
.conv-seg-content.active{display:block}
.ib-search{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);margin:12px 16px}
.ib-search svg{width:16px;height:16px;color:var(--ink-3);flex-shrink:0}
.ib-search input{border:none;background:none;font-size:13px;color:var(--ink);width:100%}
.ib-search input::placeholder{color:var(--ink-4)}

/* Approval cards */
.ib-approval{margin:0 16px 8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:12px;transition:border-color var(--dur)}
.ib-approval:hover{border-color:var(--ink-4)}
.ib-approval--urgent{border-left:3px solid var(--danger)}
.ib-approval--new{border-left:3px solid var(--accent)}
.ib-approval--pending{border-left:3px solid var(--warning)}
.ib-approval-top{display:flex;align-items:center;gap:10px}
.ib-approval-ic{width:32px;height:32px;border-radius:var(--r-xs);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ib-approval-ic svg{width:15px;height:15px}
.ib-approval-ic--leave{background:var(--warning-soft);color:var(--warning)}
.ib-approval-ic--adm{background:var(--accent-soft);color:var(--accent)}
.ib-approval-ic--tc{background:var(--surface-3);color:var(--ink-2)}
.ib-approval-ic--fee{background:var(--accent-soft);color:var(--accent)}
.ib-approval-body{flex:1;min-width:0}
.ib-approval-title{font-size:13px;font-weight:600;color:var(--ink)}
.ib-approval-meta{font-size:11px;color:var(--ink-3);margin-top:1px}
.ib-approval-tag{font-size:10px;font-weight:600;padding:3px 8px;border-radius:var(--r-xs);flex-shrink:0}
.ib-approval-tag--urgent{background:var(--danger-soft);color:var(--danger)}
.ib-approval-tag--new{background:var(--accent-soft);color:var(--accent)}
.ib-approval-tag--pending{background:var(--warning-soft);color:var(--warning)}
.ib-approval-actions{display:flex;gap:6px;margin-top:10px}
.ib-approval-btn{font-size:11px;font-weight:600;padding:6px 12px;border-radius:var(--r-xs);transition:opacity var(--dur)}
.ib-approval-btn:active{opacity:.6}
.ib-approval-btn--approve{background:var(--success);color:#fff}
.ib-approval-btn--reject{background:var(--danger-soft);color:var(--danger)}
.ib-approval-btn--view{background:var(--surface-2);color:var(--ink-2)}

/* Conversation threads */
.conv-thread{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line-soft);transition:background var(--dur)}
.conv-thread:hover{background:var(--surface-2)}
.conv-thread:active{opacity:.7}
.conv-thread:first-child{border-top:1px solid var(--line-soft)}
.conv-avatar-wrap{position:relative;flex-shrink:0}
.conv-avatar-status{position:absolute;bottom:0;right:0;width:9px;height:9px;border-radius:50%;border:2px solid var(--surface)}
.conv-avatar-status--online{background:var(--success)}
.conv-avatar-status--away{background:var(--warning)}
.conv-info{flex:1;min-width:0}
.conv-name{font-size:13px;font-weight:600;color:var(--ink)}
.conv-preview{font-size:11px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.conv-meta{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex-shrink:0}
.conv-time{font-size:10px;color:var(--ink-4)}
.conv-unread{min-width:18px;height:18px;border-radius:9px;background:var(--accent);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 5px}

/* Announcements */
.ov-ann-item{margin:0 16px 10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:12px}
.ov-ann-cat{font-size:10px;font-weight:600;padding:2px 8px;border-radius:var(--r-xs);background:var(--surface-3);color:var(--ink-2);display:inline-block}
.ov-ann-title{font-size:13px;font-weight:600;color:var(--ink);margin-top:6px}
.ov-ann-body{font-size:12px;color:var(--ink-2);margin-top:4px;line-height:1.5}
.ov-ann-time{font-size:10px;color:var(--ink-4);margin-top:6px}

/* Comms entry */
.comms-entry{display:flex;align-items:center;gap:12px;margin:12px 16px;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);transition:opacity var(--dur)}
.comms-entry:active{opacity:.7}
.comms-entry-ic{width:36px;height:36px;border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.comms-entry-ic svg{width:18px;height:18px}
.comms-entry-ic--ptm{background:var(--success-soft);color:var(--success)}
.comms-entry-ic--notif{background:var(--accent-soft);color:var(--accent)}
.comms-entry-body{flex:1}
.comms-entry-title{font-size:13px;font-weight:600;color:var(--ink)}
.comms-entry-sub{font-size:11px;color:var(--ink-3);margin-top:1px}

/* Settings */
.set-profile-card{margin:12px 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:14px;transition:opacity var(--dur)}
.set-profile-card:active{opacity:.7}
.set-profile-top{display:flex;align-items:center;gap:12px}
.set-profile-avatar{width:48px;height:48px;border-radius:50%;background:var(--accent);color:#fff;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.set-profile-info{flex:1;min-width:0}
.set-profile-name{font-size:14px;font-weight:700;color:var(--ink)}
.set-profile-role{font-size:12px;color:var(--ink-2);margin-top:1px}
.set-profile-pct{font-size:11px;color:var(--ink-3);margin-top:2px}
.set-profile-bar{height:4px;background:var(--surface-3);border-radius:2px;margin-top:10px;overflow:hidden}
.set-profile-bar-fill{height:100%;background:var(--accent);border-radius:2px}
.set-row{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--line-soft);transition:background var(--dur)}
.set-row:hover{background:var(--surface-2)}
.set-row:active{opacity:.7}
.set-row:first-child{border-top:1px solid var(--line-soft)}
.set-row-ic{width:32px;height:32px;border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--surface-2);color:var(--ink-2)}
.set-row-ic svg{width:16px;height:16px}
.set-row-body{flex:1;min-width:0}
.set-row-title{font-size:13px;font-weight:600;color:var(--ink)}
.set-row-sub{font-size:11px;color:var(--ink-3);margin-top:1px}
.set-row-chevron{width:16px;height:16px;color:var(--ink-4);flex-shrink:0}
.set-row-badge{font-size:9px;font-weight:700;padding:3px 7px;border-radius:var(--r-xs);background:var(--warning-soft);color:var(--warning);flex-shrink:0}
.set-theme{padding:16px}
.set-theme-title{font-size:13px;font-weight:600;color:var(--ink);margin-bottom:8px}
.set-theme-opts{display:flex;gap:6px}
.set-theme-opt{flex:1;padding:8px;border-radius:var(--r-sm);font-size:11px;font-weight:600;color:var(--ink-3);background:var(--surface);border:1px solid var(--line);transition:all var(--dur)}
.set-theme-opt:active{opacity:.7}
.set-theme-opt.active{background:var(--accent);color:#fff;border-color:var(--accent)}

/* Overlays */
.overlay{position:absolute;top:0;left:0;right:0;bottom:0;background:var(--bg);z-index:50;transform:translateX(100%);transition:transform var(--dur) var(--ease);overflow-y:auto}
.overlay.open{transform:translateX(0)}
.overlay-header{position:sticky;top:0;height:52px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:0 16px;z-index:5}
.overlay-back{width:32px;height:32px;border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;color:var(--ink-2);transition:background var(--dur)}
.overlay-back:hover{background:var(--surface-2)}
.overlay-back:active{opacity:.6}
.overlay-back svg{transform:rotate(180deg)}
.overlay-title{font-size:16px;font-weight:600;color:var(--ink);letter-spacing:-.3px}
.overlay-body{padding:12px 0 24px}

/* Overlay components */
.ov-card{margin:0 16px 10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:14px}
.ov-card-title{font-size:13px;font-weight:600;color:var(--ink);margin-bottom:8px}
.ov-btn{display:flex;align-items:center;justify-content:center;gap:6px;width:calc(100% - 32px);margin:12px 16px;padding:11px;border-radius:var(--r-sm);background:var(--accent);color:#fff;font-size:13px;font-weight:600;transition:opacity var(--dur)}
.ov-btn:active{opacity:.8}
.ov-btn svg{width:15px;height:15px}
.ov-input{width:100%;padding:10px 14px;border:1px solid var(--line);border-radius:var(--r-sm);font-size:13px;color:var(--ink);background:var(--surface);margin-bottom:8px}
.ov-input:focus{border-color:var(--accent)}
.ov-textarea{min-height:80px;resize:vertical;font-family:var(--font)}
.ov-ann-form{padding:12px 16px}
.ov-ann-chips{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.ov-ann-chip{padding:5px 12px;border-radius:var(--r-sm);font-size:11px;font-weight:600;color:var(--ink-3);background:var(--surface);border:1px solid var(--line);transition:all var(--dur)}
.ov-ann-chip:active{opacity:.7}
.ov-ann-chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}

/* Notifications */
.ov-notif-filters{display:flex;gap:6px;padding:0 16px;margin-bottom:8px}
.ov-notif-filter{padding:6px 14px;border-radius:var(--r-sm);font-size:12px;font-weight:600;color:var(--ink-3);background:var(--surface);border:1px solid var(--line);transition:all var(--dur)}
.ov-notif-filter:active{opacity:.7}
.ov-notif-filter.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.ov-notif-markall{display:flex;align-items:center;gap:4px;padding:6px 16px;font-size:12px;font-weight:600;color:var(--accent);transition:opacity var(--dur)}
.ov-notif-markall:active{opacity:.6}
.ov-notif-markall svg{width:14px;height:14px}
.ov-notif-group{font-size:11px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.5px;padding:12px 16px 6px}
.ov-notif{display:flex;gap:10px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line-soft)}
.ov-notif:first-child{border-top:1px solid var(--line-soft)}
.ov-notif-icon{width:32px;height:32px;border-radius:var(--r-xs);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ov-notif-icon svg{width:15px;height:15px}
.ov-notif-icon--alert{background:var(--danger-soft);color:var(--danger)}
.ov-notif-icon--msg{background:var(--accent-soft);color:var(--accent)}
.ov-notif-icon--fee{background:var(--success-soft);color:var(--success)}
.ov-notif-icon--bell{background:var(--accent-soft);color:var(--accent)}
.ov-notif-icon--evt{background:var(--surface-3);color:var(--ink-2)}
.ov-notif-info{flex:1;min-width:0}
.ov-notif-title{font-size:13px;font-weight:600;color:var(--ink)}
.ov-notif-body{font-size:12px;color:var(--ink-2);margin-top:1px}
.ov-notif-time{font-size:10px;color:var(--ink-4);margin-top:3px}
.ov-notif-actions{display:flex;gap:6px;margin-top:6px}
.ov-notif-btn{font-size:11px;font-weight:600;padding:5px 10px;border-radius:var(--r-xs);transition:opacity var(--dur)}
.ov-notif-btn:active{opacity:.6}
.ov-notif-btn--approve{background:var(--success);color:#fff}
.ov-notif-btn--reject{background:var(--danger-soft);color:var(--danger)}
.ov-notif-btn--read{background:var(--surface-2);color:var(--ink-2)}
.ov-notif--urgent{border-left:3px solid var(--danger)}
.ov-notif--unread{border-left:3px solid var(--accent)}

/* Staff directory */
.ov-staff-item{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line-soft)}
.ov-staff-item:first-child{border-top:1px solid var(--line-soft)}
.ov-staff-avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;background:var(--surface-3);color:var(--ink-2)}
.ov-staff-info{flex:1;min-width:0}
.ov-staff-name{font-size:13px;font-weight:600;color:var(--ink)}
.ov-staff-role{font-size:11px;color:var(--ink-3);margin-top:1px}
.ov-staff-status{font-size:10px;font-weight:600;padding:3px 8px;border-radius:var(--r-xs);flex-shrink:0}
.ov-staff-status--active{background:var(--success-soft);color:var(--success)}
.ov-staff-status--leave{background:var(--warning-soft);color:var(--warning)}

/* Reports */
.ov-rpt-item{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--line-soft)}
.ov-rpt-item:first-child{border-top:1px solid var(--line-soft)}
.ov-rpt-info{flex:1;min-width:0}
.ov-rpt-name{font-size:13px;font-weight:600;color:var(--ink)}
.ov-rpt-meta{font-size:11px;color:var(--ink-3);margin-top:1px}
.ov-rpt-status{font-size:10px;font-weight:600;padding:3px 8px;border-radius:var(--r-xs);flex-shrink:0;white-space:nowrap}
.ov-rpt-status--ready{background:var(--success-soft);color:var(--success)}
.ov-rpt-status--gen{background:var(--warning-soft);color:var(--warning)}
.ov-rpt-status--sched{background:var(--surface-3);color:var(--ink-2)}

/* Calendar */
.ov-cal{margin:0 16px 12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:14px}
.ov-cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.ov-cal-day{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;color:var(--ink-2);border-radius:var(--r-xs)}
.ov-cal-day--header{font-size:10px;font-weight:700;color:var(--ink-3);text-transform:uppercase}
.ov-cal-day--empty{color:var(--ink-4)}
.ov-cal-day--today{background:var(--accent);color:#fff;font-weight:700}
.ov-cal-day--event{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.ov-cal-evt{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line-soft)}
.ov-cal-evt:last-child{border-bottom:none;padding-bottom:0}
.ov-cal-evt-date{font-size:11px;font-weight:700;color:var(--accent);min-width:48px;flex-shrink:0}
.ov-cal-evt-name{font-size:12px;font-weight:600;color:var(--ink)}
.ov-cal-evt-desc{font-size:11px;color:var(--ink-3);margin-top:1px}

/* Chat */
.ov-conv-detail{display:flex;flex-direction:column;height:100%}
.ov-conv-header{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.ov-conv-avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;background:var(--surface-3);color:var(--ink-2)}
.ov-conv-name{font-size:14px;font-weight:600;color:var(--ink)}
.ov-conv-sub{font-size:11px;color:var(--ink-3)}
.ov-chat-msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px}
.ov-chat-msgs::-webkit-scrollbar{width:0}
.ov-bubble{max-width:75%;padding:10px 14px;border-radius:var(--r-md);font-size:13px;line-height:1.5}
.ov-bubble--tutor{background:var(--surface);border:1px solid var(--line);color:var(--ink);align-self:flex-start;border-bottom-left-radius:4px}
.ov-bubble--user{background:var(--accent);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.ov-chat-input{display:flex;gap:8px;padding:10px 16px;background:var(--surface);border-top:1px solid var(--line)}
.ov-chat-input input{flex:1;padding:10px 14px;border:1px solid var(--line);border-radius:var(--r-sm);font-size:13px;color:var(--ink);background:var(--bg)}
.ov-chat-input input:focus{border-color:var(--accent)}
.ov-chat-send{width:38px;height:38px;border-radius:var(--r-sm);background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:opacity var(--dur)}
.ov-chat-send:active{opacity:.8}
.ov-chat-send svg{width:16px;height:16px}

}
