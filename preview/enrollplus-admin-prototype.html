<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enroll+ — Admin Portal Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#FBF8F4;--cream-deep:#F5F0E8;--white:#FFF;
  --surface:#FBF8F4;--surface-tint:#F8F4EF;--surface-warm:#FFF6EE;--surface-cl:#F5F0E8;
  --ink:#1A1614;--ink-2:#5C544E;--ink-3:#8A8078;--ink-4:#D6D3D1;
  --line:#E8E0D6;--line-soft:#F0EAE0;--outline:#E2DDD4;--outline-soft:#EDE8E0;
  --sienna:#B45309;--sienna-hover:#92400E;--sienna-soft:#FEF3C7;
  --coral:#E76F51;--coral-soft:#FCE8E2;
  --gold:#D4A017;--gold-soft:#FBF0D6;
  --mint:#2D7A4A;--mint-soft:#D4EDDB;
  --sky:#3B82A0;--sky-soft:#DBEEF5;
  --plum:#7C3A6B;--plum-soft:#F0E4ED;
  --success:#2D7A4A;--success-soft:#D4EDDB;
  --error:#C84A3E;--error-soft:#F9DCD8;
  --warning:#B07500;--warning-soft:#FBF0D6;
  --r-sm:10px;--r-md:14px;--r-lg:18px;--r-xl:24px;--r-2xl:28px;--r-full:9999px;
  --s-xs:4px;--s-sm:8px;--s-md:16px;--s-lg:24px;--s-xl:32px;--s-2xl:40px;
  --font:'Inter',-apple-system,system-ui,sans-serif;
  --fw-r:400;--fw-m:500;--fw-s:600;--fw-b:700;--fw-eb:800;--fw-xb:900;
  --dur:250ms;--ease:cubic-bezier(0.2,0,0,1);--ease-smooth:cubic-bezier(0.4,0,0.2,1);
  --shadow-1:0 1px 2px rgba(26,22,20,.04),0 1px 3px rgba(26,22,20,.06);
  --shadow-2:0 2px 8px -2px rgba(26,22,20,.08),0 1px 3px rgba(26,22,20,.04);
  --shadow-3:0 8px 24px -6px rgba(26,22,20,.1),0 2px 8px rgba(26,22,20,.04);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:var(--font);background:#0A0910;display:flex;align-items:center;justify-content:center;overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;text-rendering:optimizeLegibility}
svg{display:block}
.shell{display:flex;height:100vh;width:100vw}
.sidebar{width:260px;background:#131218;padding:var(--s-lg) var(--s-md);overflow-y:auto;flex-shrink:0;border-right:1px solid #1E1D26;scrollbar-width:none}
.sidebar::-webkit-scrollbar{display:none}
.sidebar .brand{display:flex;align-items:center;gap:10px;margin-bottom:var(--s-xl);padding:0 var(--s-sm)}
.sidebar .brand-name{font-size:18px;font-weight:var(--fw-eb);color:#fff;letter-spacing:-.5px}
.sidebar .brand-name .plus{color:var(--sienna)}
.sidebar .nav-group{font-size:11px;color:#56545F;text-transform:uppercase;letter-spacing:1.6px;margin:var(--s-lg) var(--s-sm) var(--s-xs);font-weight:var(--fw-b)}
.sidebar .nav-item{display:flex;align-items:center;gap:10px;background:transparent;border:none;color:#8B8895;padding:11px var(--s-sm);border-radius:var(--r-full);font-size:14px;font-family:var(--font);font-weight:var(--fw-m);text-align:left;cursor:pointer;width:100%;transition:all var(--dur) var(--ease)}
.sidebar .nav-item:hover{background:#1C1B24;color:#C0BDC8}
.sidebar .nav-item.active{background:var(--sienna);color:#fff}
.sidebar .nav-dot{width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.35;flex-shrink:0}
.sidebar .nav-item.active .nav-dot{opacity:1}
.phone-wrap{flex:1;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,#131218 0%,#0A0910 100%);overflow:hidden}
.phone{width:390px;height:844px;background:#000;border-radius:50px;padding:8px;box-shadow:0 0 0 1.5px rgba(255,255,255,.04),0 0 0 6px rgba(0,0,0,.3),0 40px 100px rgba(0,0,0,.6),0 15px 40px rgba(0,0,0,.3);flex-shrink:0;position:relative;transform:scale(var(--phone-scale,1));transform-origin:center center}
.screen-area{width:100%;height:100%;background:var(--cream);border-radius:42px;overflow:hidden;position:relative;display:flex;flex-direction:column}
.island{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:100px;height:28px;background:#000;border-radius:20px;z-index:100}
.home-bar{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);width:120px;height:4px;background:rgba(0,0,0,.3);border-radius:4px;z-index:100}
.statusbar{display:flex;justify-content:space-between;align-items:center;padding:12px 32px 4px;font-size:14px;font-weight:var(--fw-s);flex-shrink:0;z-index:10;color:var(--ink)}
.statusbar .icons{font-size:13px;letter-spacing:-.5px}
.scroll{flex:1;overflow-y:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.scroll::-webkit-scrollbar{display:none}
.content-pb{padding-bottom:90px}
.tab-content{display:none;flex:1;flex-direction:column;overflow:hidden}
.tab-content.active{display:flex}
.portal-header{display:flex;align-items:center;justify-content:space-between;padding:8px var(--s-lg) var(--s-md);flex-shrink:0}
.portal-header-school{font-size:11px;font-weight:700;color:var(--ink-3);letter-spacing:.5px;text-transform:uppercase}
.portal-header-name{display:flex;align-items:center;gap:6px;cursor:pointer}
.portal-header-name-text{font-size:17px;font-weight:800;color:var(--ink);letter-spacing:-.4px}
.portal-header-chevron{width:14px;height:14px;stroke:var(--ink-3);stroke-width:2;fill:none}
.portal-header-right{display:flex;align-items:center;gap:8px}
.header-icon-btn{width:38px;height:38px;border-radius:var(--r-full);background:var(--white);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;transition:all 250ms var(--ease);box-shadow:var(--shadow-1)}
.header-icon-btn:hover{box-shadow:var(--shadow-2);transform:translateY(-1px)}
.header-icon-btn svg{width:18px;height:18px;stroke:var(--ink-2);stroke-width:2;fill:none}
.header-badge{position:absolute;top:-3px;right:-3px;min-width:17px;height:17px;border-radius:var(--r-full);background:var(--coral);color:#fff;font-size:9px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 5px;border:2px solid var(--white)}
</style>
</head>
<body>
<!-- BODY_PLACEHOLDER -->
</body>
</html>
