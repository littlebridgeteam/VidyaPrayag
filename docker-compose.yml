services:
  db:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_DB: vidyaprayag
      POSTGRES_USER: vidyaprayag
      POSTGRES_PASSWORD: vidyaprayag_dev
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vidyaprayag -d vidyaprayag"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    environment:
      DATABASE_URL: "jdbc:postgresql://db:5432/vidyaprayag?user=vidyaprayag&password=vidyaprayag_dev"
      AUTO_CREATE_TABLES: "true"
      APP_ENV: "development"
      APP_SEED_CMS: "true"
      APP_SEED_DEMO: "true"
      JWT_SECRET: "dev-jwt-secret-change-in-production-min-32-chars"
      OTP_ENABLE_CONSOLE_FALLBACK: "true"
      OTP_DEV_RETURN_CODE: "true"
      CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://server:3000"
      AI_ENCRYPTION_KEY: ""
      PORT: "8080"
    ports:
      - "8080:8080"

  website:
    build:
      context: .
      dockerfile: website/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: "http://localhost:8080"
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    environment:
      NEXT_PUBLIC_API_BASE_URL: "http://localhost:8080"
    ports:
      - "3000:3000"

volumes:
  db_data:
